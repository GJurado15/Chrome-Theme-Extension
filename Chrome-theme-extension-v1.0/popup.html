<!DOCTYPE html>
<html>

<head>
  <style>
    body {
      width: 320px;
      font-family: 'Segoe UI', Tahoma, sans-serif;
      padding: 15px;
      background-color: #f9f9f9;
    }

    h3 {
      text-align: center;
      color: #333;
      margin-top: 0;
    }

    .control-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: bold;
      color: #555;
      margin-bottom: 4px;
    }

    select,
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 15px;
      background-color: #4285f4;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background-color: #357ae8;
    }

    button:disabled {
      cursor: default;
      opacity: 0.85;
    }

    .instructions {
      font-size: 12px;
      color: #666;
      margin-top: 15px;
      background: #eee;
      padding: 8px;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <h3>Chrome Theme Manifest Generator</h3>

  <p style="font-size:12px;color:#666;text-align:center;margin-top:-8px;">
    Creates a <strong>theme manifest file</strong>.<br>
    Does not automatically change your Chrome theme.
  </p>

  <div class="control-group">
    <label for="themeName">Theme Name:</label>
    <input type="text" id="themeName" placeholder="e.g. Midnight Blue">
  </div>

  <div class="control-group">
    <label for="frameColor">Frame Color:</label>
    <input type="color" id="frameColor" value="#4285f4">
  </div>
